name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Official release tags resolved with git ls-remote on 2026-10-28.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build interface and SDK
        run: |
          npm run build
          npm run sdk:build
      - name: Test application
        run: npm test
      - name: Install locked DOM QA runtime
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix qa/ui-tool
      - name: Test production bundle through DOM and real HTTP
        env:
          AB_UASH_UI_QA_REQUIRED: "1"
          TZ: America/Sao_Paulo
        run: AB_UASH_UI_QA_PACKAGE="$PWD/qa/ui-tool/package.json" node --test --test-reporter=spec tests/ui-*.test.mjs
      - name: Test offline maintenance and release snapshot
        run: node --test infra/tests/*.test.mjs
      - name: Check release configuration
        run: node scripts/jk-release-check.mjs check
      - name: Validate Oficina Compose
        run: docker compose -f compose.yaml config --quiet
      - name: Build and smoke test the SQLite containers
        timeout-minutes: 10
        env:
          JK_CI_SMOKE_STATE: ${{ runner.temp }}/ab-jk-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: node infra/ci-smoke.mjs run
      - name: Remove synthetic containers and data
        if: ${{ always() }}
        timeout-minutes: 2
        env:
          JK_CI_SMOKE_STATE: ${{ runner.temp }}/ab-jk-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: node infra/ci-smoke.mjs cleanup
