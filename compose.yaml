name: ab-jk-uash

x-runtime: &runtime
  image: ab-jk-uash:local
  build:
    context: .
    dockerfile: Dockerfile
  user: "1001:1001"
  init: true
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  stop_grace_period: 60s
  volumes:
    # The Oficina project already owns ../dados as 1001. Do not create a child
    # mount source: Docker would otherwise create it as root before first use.
    - type: bind
      source: ../dados
      target: /data
      bind:
        create_host_path: false
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  app:
    <<: *runtime
    mem_limit: 512m
    cpus: "1.0"
    ports:
      - "127.0.0.1:${AB_PORTA:-9220}:4173"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
      HOST: 0.0.0.0
      PORT: "4173"
      DB_PATH: /data/ab-jk-uash.sqlite
      DIST_DIR: /app/dist
      SETUP_TOKEN_FILE: /data/setup-token
      PUBLIC_ORIGIN: https://ab-pcsrv.tail6bac78.ts.net:${AB_PORTA:-9220}
      COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  maintenance:
    <<: *runtime
    command: ["node", "scripts/jk-maintenance.mjs", "watch"]
    # Maintenance uses the filesystem and native SQLite only; no DNS or HTTP.
    network_mode: none
    mem_limit: 256m
    cpus: "0.50"
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=160
      DB_PATH: /data/ab-jk-uash.sqlite
      JK_BACKUP_INTERVAL_SECONDS: "21600"
      JK_BACKUP_KEEP: "28"
    healthcheck:
      test: ["CMD", "node", "scripts/jk-maintenance.mjs", "health"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
